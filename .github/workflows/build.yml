# Verifica o projeto e gera os instaladores de macOS, Windows e Linux a cada push.
# Os instaladores ficam nos "Artifacts" da execução (aba Actions do GitHub).
name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verificar (formato, clippy, testes, interface)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/nodo-app/ui/pnpm-lock.yaml
      - name: Dependências do sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm --dir crates/nodo-app/ui install --frozen-lockfile
      - name: Versões iguais (Cargo, tauri.conf, package.json)
        run: scripts/check-version.sh
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy (avisos viram erro)
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes do núcleo, MCP e app
        run: cargo test --workspace
      - name: Tipos da interface
        run: pnpm --dir crates/nodo-app/ui run check
      - name: Testes da interface
        run: pnpm --dir crates/nodo-app/ui run test

  bundle:
    name: Instalador (${{ matrix.name }})
    # Roda junto com a verificação, não depois: o instalador de cada commit sai mesmo se um teste falhar
    # (a verificação continua vermelha e aparece no commit).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/nodo-app/ui/pnpm-lock.yaml
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm --dir crates/nodo-app/ui install --frozen-lockfile
      # Pela CLI do Tauri: é ela que roda o beforeBuildCommand e embute a interface (cargo build sozinho abre vazio).
      - run: crates/nodo-app/ui/node_modules/.bin/tauri build ${{ matrix.args }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Nodo-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
