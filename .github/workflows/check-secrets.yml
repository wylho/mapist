# Confere os segredos sem mostrar nenhum valor: a chave das atualizações abre com a senha e assina um arquivo de teste,
# e o token do Cloudflare é aceito pela API. Rodar depois de criar ou trocar um segredo:
# Actions → Conferir segredos → Run workflow.
name: Conferir segredos

on:
  workflow_dispatch:

jobs:
  check:
    name: Conferir segredos
    runs-on: ubuntu-24.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Conferir
        run: |
          fail=0
          ok() { echo "✅ $1"; }
          bad() { echo "❌ $1"; fail=1; }

          echo teste > teste.txt
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then bad "TAURI_SIGNING_PRIVATE_KEY (vazio)"
          elif npx -y @tauri-apps/cli@2 signer sign teste.txt > /dev/null 2>&1 && [[ -s teste.txt.sig ]]; then
            ok "TAURI_SIGNING_PRIVATE_KEY + _PASSWORD (a chave abriu com a senha e assinou)"
          else bad "TAURI_SIGNING_PRIVATE_KEY ou _PASSWORD (a chave não abriu com a senha)"; fi

          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then bad "CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID (vazio)"
          elif curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/nodo" > /dev/null; then
            ok "CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (o projeto nodo abriu)"
          else bad "CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID (a API recusou)"; fi

          exit $fail
