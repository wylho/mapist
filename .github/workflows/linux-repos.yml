# Repositórios apt (Ubuntu, Debian) e dnf (Fedora) do Nodo: monta os índices assinados a partir do .deb e do .rpm de
# um Release e sobe para o mesmo Release (apt-*, rpm-*). O site redireciona /apt e /rpm para o último Release
# (site/_redirects). Roda sozinho em cada lançamento (release.yml) e à mão para refazer os índices de um Release:
# Actions → Repositórios Linux → Run workflow.
# Segredo: NODO_GPG_PRIVATE_KEY (a chave privada do repositório; a pública fica em site/linux/).
name: Repositórios Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release, por exemplo v0.2.0 (vazio: a versão do tauri.conf.json)'
        required: false
  workflow_call:

permissions:
  contents: write

jobs:
  repos:
    name: Montar os repositórios apt e dnf
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c
      - name: Chave do repositório
        env:
          KEY: ${{ secrets.NODO_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::error::Falta o segredo NODO_GPG_PRIVATE_KEY: sem ele não há como assinar os repositórios."
            exit 1
          fi
          printf '%s\n' "$KEY" | gpg --batch --import
      - name: Montar e subir
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG:-v$(node -p "require('./crates/nodo-app/tauri.conf.json').version")}"
          gh release download "$tag" -p '*.deb' -p '*.rpm' -D pkgs
          scripts/linux-repos.sh pkgs repos
          gh release upload "$tag" repos/* --clobber
