# Publica a pasta site/ no Cloudflare Pages (projeto "nodo", nodo-1c7.pages.dev) a cada push no main que mexa nela.
# Não depende da conexão do painel do Cloudflare com o GitHub, que se perde quando o repositório muda de nome.
# Precisa de dois segredos no repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token com a permissão "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  o ID da conta (aparece na lateral do painel do Cloudflare)
# Sem eles, o job avisa e termina sem erro.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'wrangler.toml', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar no Cloudflare Pages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Segredos ausentes
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Faltam CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID nos segredos do repositório; o site não foi publicado."
      - uses: actions/checkout@v5
        if: env.HAS_TOKEN == 'true'
      - name: Publicar site/
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=nodo --branch=main --commit-dirty=true
