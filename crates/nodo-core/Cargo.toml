[package]
name = "nodo-core"
description = "Core mind-map model, layout, and document I/O. UI-free, embeddable by the app and the MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
uuid.workspace = true
# What the Nodo and the Ideario share (note Markdown, card rules, the card preview, attachments and the photo
# pipeline): one crate.
atrio = { git = "https://github.com/wylho/atrio", tag = "v0.18.0", features = ["media"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1"
atrio = { git = "https://github.com/wylho/atrio", tag = "v0.18.0", features = ["media", "testdoc"] }
