<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nodo — protótipo visual (design Ideario)</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Nodo — protótipo visual alinhado ao Ideario.

   Os tokens abaixo são COPIADOS de ideario/src/app.css (v0.4.4) para garantir
   paridade visual. Não invente valores aqui: se o Ideario mudar, replique.

   Diferença de contexto: o Ideario é uma coluna de celular (máx. 440px) com
   cards; o Nodo é uma tela larga com canvas. Então reaproveito os tokens e
   os componentes (icon-btn, chip, pill, seg, card, drawer), mas o esqueleto
   é próprio.
   ══════════════════════════════════════════════════════════════════════════ */

*, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
html { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
ol, ul, menu { list-style: none; }
img, svg, video { display: block; vertical-align: middle; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; background: transparent; }
a { color: inherit; text-decoration: inherit; }
b, strong { font-weight: bolder; }

/* ── tokens ──────────────────────────────────────────────────────────────
   As cores NÃO ficam mais fixas aqui. O tema ativo é aplicado pelo theme.js
   como variáveis inline no <html>, exatamente como o Ideario faz. Os valores
   abaixo são só o fallback (tema Ideario claro) para a primeira pintura.
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --bg: #eef1ef; --stage: #dfe4e1; --surface: #ffffff; --raised: #f7f9f8;
  --fg: #16201c; --muted: #5d6a65; --line: #d6ddd9; --card-edge: rgb(22 32 28 / .09);
  --accent: #2547c9; --accent-soft: #e2e8fb; --on-accent: #ffffff;
  --late: #c03b2b; --late-soft: #fbe3df; --good: #217a4b;
  --st-todo: #e5484d; --st-doing: #e8a400; --st-done: #2f9e5c;
  --shadow: 0 1px 2px rgb(22 32 28 / .06), 0 4px 14px rgb(22 32 28 / .06);
  --float-shadow: 0 10px 30px rgb(22 32 28 / .14), 0 1px 3px rgb(22 32 28 / .06);
  --n-sand: #f6e9d6; --n-sage: #e1eedd; --n-sky: #dde8f8;
  --n-rose: #f8e0e4; --n-lilac: #e9e2f6; --n-butter: #f8f0c8;
  --font-body: var(--font-system, system-ui), -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', sans-serif;
  --font-display: var(--font-body);
  --font-mono: var(--font-system-mono, ui-monospace), 'SF Mono', 'Cascadia Mono', Consolas, 'Ubuntu Mono', 'Noto Sans Mono', 'DejaVu Sans Mono', Menlo, monospace;
}

/* ── base do Ideario ──────────────────────────────────────────────────── */
html, body, #app { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; -webkit-font-smoothing: antialiased; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: default; }
input, textarea, [contenteditable="true"], [contenteditable="true"] * { -webkit-user-select: text; user-select: text; cursor: auto; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── esqueleto do Nodo ──────────────────────────────────────────────── */
.shell { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

/* barra superior: mesma altura (64px) e mesmo respiro da appbar do Ideario */
.appbar {
  display: flex; align-items: center; gap: 8px;
  height: 64px; padding: 0 14px; border-bottom: 1px solid var(--line); flex: none;
  background: var(--bg); z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; padding-right: 14px; margin-right: 4px; border-right: 1px solid var(--line); flex: none; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); flex: none; }
.brand-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -.02em; }

.top-left { display: flex; align-items: center; gap: 4px; flex: none; }
.top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; flex: 1; min-width: 0; }

/* icon-btn: idêntico ao Ideario */
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; color: var(--fg); flex: none;
}
.icon-btn:hover { background: var(--raised); }
.icon-btn.active { color: var(--accent); background: var(--accent-soft); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.icon-btn.sm { width: 32px; height: 32px; color: var(--muted); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.sm svg { width: 17px; height: 17px; }

/* botão com rótulo: pílula, como os .seg-item do Ideario */
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 15px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 500; color: var(--fg);
  white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: color-mix(in oklab, var(--accent) 88%, black); }
.btn svg { width: 17px; height: 17px; }

/* busca: pílula arredondada, igual ao .search do Ideario */
.search { flex: 0 1 260px; min-width: 170px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font: inherit; }
.search input::placeholder { color: var(--muted); }
.search svg { width: 17px; height: 17px; flex: none; }

/* ── corpo: canvas + inspetor ─────────────────────────────────────────── */
.body { flex: 1; min-height: 0; display: flex; position: relative; }

.stage {
  flex: 1; min-width: 0; position: relative; overflow: hidden;
  background: var(--stage);
}
.stage canvas { display: block; width: 100%; height: 100%; }
.stage.panning canvas { cursor: grabbing; }

/* pílulas de escopo, como o .scope-bar do Ideario, flutuando sobre o canvas */
.scope-bar {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; z-index: 6; pointer-events: none;
}
.scope-pill {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px;
  box-shadow: var(--shadow);
}
.scope-pill button { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 999px; }
.scope-pill button:hover { background: rgb(0 0 0 / .08); }

/* zoom: pílula flutuante, mesmo tratamento do .tabbar do Ideario */
.zoombar {
  position: absolute; right: 16px; bottom: 16px; z-index: 6;
  display: flex; align-items: center; gap: 2px; padding: 5px;
  border-radius: 999px; background: color-mix(in oklab, var(--surface) 92%, transparent);
  backdrop-filter: blur(16px); border: 1px solid var(--line); box-shadow: var(--float-shadow);
}
.zoombar button { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 999px; color: var(--fg); }
.zoombar button:hover { background: var(--raised); }
.zoombar svg { width: 17px; height: 17px; }
.zoomlevel { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 46px; text-align: center; font-weight: 600; }

/* ── inspetor: painel com superfície e cards do Ideario ───────────────── */
.inspector {
  flex: none; width: 320px; background: var(--bg); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden;
}
.inspector-head { padding: 20px 18px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.inspector-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: rgb(127 140 135 / .14); color: var(--fg); white-space: nowrap;
}
.pill.tag { color: var(--accent); background: transparent; border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent); }

.inspector-body { flex: 1; overflow-y: auto; padding: 0 12px 20px; display: flex; flex-direction: column; gap: 10px; }
.inspector-body::-webkit-scrollbar { width: 10px; }
.inspector-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid var(--bg); }

/* card: idêntico ao .card do Ideario */
.card { position: relative; border-radius: 16px; background: var(--n-none); border: 1px solid var(--card-edge); }
.card-body { padding: 13px 14px; display: flex; flex-direction: column; gap: 9px; }

.field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
.field-hint { font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 11.5px; }

.field textarea, .field input[type="text"] {
  width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; resize: vertical; outline: none; color: var(--fg); font-size: 14px;
  transition: border-color .12s, box-shadow .12s;
}
.field textarea:focus, .field input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea::placeholder { color: var(--muted); }

/* swatches: usam as cores de nó do Ideario (--n-*) */
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--card-edge); position: relative; transition: transform .12s; }
.swatch:hover { transform: scale(1.08); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.swatch--none { background: var(--raised); border-style: dashed; border-color: var(--muted); display: grid; place-items: center; color: var(--muted); font-size: 14px; }

/* seg: idêntico ao .seg.tight do Ideario */
.seg { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button {
  flex: 1; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg svg { width: 15px; height: 15px; }

/* stats: idêntico ao .stats do Ideario */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats > div { background: var(--surface); border: 1px solid var(--card-edge); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11.5px; color: var(--muted); line-height: 1.25; }

/* atalhos: linhas como o .r-item do Ideario */
.keys { background: var(--surface); border: 1px solid var(--card-edge); border-radius: 16px; overflow: hidden; }
.keys-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 13px; font-size: 13px; color: var(--muted); }
.keys-row + .keys-row { border-top: 1px solid var(--line); }
kbd {
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--fg);
  background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 3px 7px; min-width: 24px; text-align: center;
}

/* banner de status: como o .banner do Ideario */
.banner { padding: 10px 14px; border-radius: 12px; background: var(--raised); color: var(--muted); font-size: 13px; }

/* seletor de tema, flutuante sobre o canvas */
.theme-toggle {
  position: absolute; top: 16px; right: 16px; z-index: 7;
  display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px;
  background: color-mix(in oklab, var(--surface) 92%, transparent); backdrop-filter: blur(16px);
  border: 1px solid var(--line); box-shadow: var(--float-shadow);
}
.theme-toggle button {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; color: var(--fg);
}
.theme-toggle button:hover { background: var(--raised); }
.theme-toggle button:last-child { padding: 0; width: 32px; justify-content: center; }
.theme-toggle svg { width: 16px; height: 16px; }

/* folha de temas: gaveta à direita, como o .drawer do Ideario */
.overlay { position: fixed; inset: 0; background: rgb(10 14 13 / .38); z-index: 20; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.theme-sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(92vw, 380px);
  background: var(--bg); border-left: 1px solid var(--line); border-radius: 24px 0 0 24px;
  display: flex; flex-direction: column; box-shadow: var(--float-shadow);
  animation: slide-in .2s cubic-bezier(.2,.8,.2,1);
}
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
.theme-sheet-head { padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
.theme-sheet-body { flex: 1; overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.theme-group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding-inline: 4px; }

.theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.theme-tile {
  display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--card-edge); transition: border-color .12s, box-shadow .12s;
}
.theme-tile:hover { box-shadow: var(--shadow); }
.theme-tile[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
.theme-swatch { position: relative; display: block; height: 46px; border-radius: 9px; overflow: hidden; }
.theme-card { position: absolute; left: 7px; top: 7px; right: 7px; bottom: 7px; border-radius: 6px; border: 1px solid; }
.theme-dots { position: absolute; left: 11px; bottom: 11px; display: flex; gap: 3px; }
.theme-dots i { width: 7px; height: 7px; border-radius: 999px; display: block; }
.theme-name { font-size: 12.5px; font-weight: 600; }
.theme-hint { font-size: 11px; color: var(--muted); line-height: 1.3; }

/* responsivo: abaixo de 900px o inspetor vira gaveta inferior */
@media (max-width: 900px) {
  .inspector { position: absolute; right: 0; bottom: 0; left: 0; width: auto; height: 46%; border-left: 0; border-top: 1px solid var(--line); border-radius: 24px 24px 0 0; box-shadow: var(--float-shadow); }
  .inspector-body { padding-bottom: 12px; }
}
</style>
</head>
<body>
<div class="shell" id="app">

  <!-- ── barra superior (appbar do Ideario) ───────────────────────────── -->
  <header class="appbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 9V4M12 15v5M9 12H4M15 12h5"/>
        </svg>
      </div>
      <span class="brand-name">Nodo</span>
    </div>

    <div class="top-left">
      <button class="btn" title="Novo mapa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Novo
      </button>
      <button class="btn" title="Abrir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Abrir
      </button>
      <button class="btn" title="Salvar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        Salvar
      </button>

      <div style="width:1px;height:24px;background:var(--line);margin:0 6px"></div>

      <button class="btn primary" title="Adicionar filho (Tab)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Filho
      </button>
      <button class="icon-btn" title="Excluir nó (Del)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
      <button class="icon-btn" title="Dobrar ramo (Space)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>
      </button>
    </div>

    <div class="top-actions">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="Buscar nós…" />
      </label>
      <button class="icon-btn" title="Desfazer (⌘Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.1-9.4L3 7"/></svg>
      </button>
      <button class="icon-btn" title="Refazer (⌘⇧Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M20.5 13a9 9 0 1 1-2.1-9.4L21 7"/></svg>
      </button>
    </div>
  </header>

  <!-- ── corpo ────────────────────────────────────────────────────────── -->
  <div class="body">
    <main class="stage" id="stage">
      <canvas id="canvas"></canvas>

      <div class="theme-toggle">
        <button id="theme-open" title="Tema">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18 4.5 4.5 0 0 1 0-9 4.5 4.5 0 0 0 0-9"/></svg>
          <span id="theme-label">Ideario</span>
        </button>
        <button id="mode-toggle" title="Claro / escuro">
          <svg id="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>

      <div class="scope-bar">
        <span class="scope-pill">
          Product Roadmap
          <button title="Limpar seleção">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </span>
      </div>

      <div class="zoombar">
        <button id="zoom-out" title="Diminuir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <span class="zoomlevel" id="zoomlevel">100%</span>
        <button id="zoom-in" title="Aumentar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="zoom-fit" title="Ajustar à tela">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M16 21h3a2 2 0 0 0 2-2v-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
        </button>
      </div>
    </main>

    <!-- ── inspetor ───────────────────────────────────────────────────── -->
    <aside class="inspector">
      <div class="inspector-head">
        <span class="inspector-title">Inspetor</span>
        <span class="pill tag" id="nodeid">#0</span>
      </div>

      <div class="inspector-body">
        <div class="card">
          <div class="card-body field">
            <label class="field-label" for="text">Texto</label>
            <textarea id="text" rows="2" placeholder="Texto do nó"></textarea>
          </div>
        </div>

        <div class="card">
          <div class="card-body field">
            <label class="field-label" for="note">Nota <span class="field-hint">markdown</span></label>
            <textarea id="note" rows="4" placeholder="Adicione uma nota…"></textarea>
          </div>
        </div>

        <div class="card">
          <div class="card-body field">
            <span class="field-label">Cor do ramo</span>
            <div class="swatches" id="swatches"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-body field">
            <span class="field-label">Lado</span>
            <div class="seg" id="sides">
              <button data-side="left" aria-pressed="false">Esquerda</button>
              <button data-side="right" aria-pressed="true">Direita</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body field">
            <span class="field-label">Layout</span>
            <div class="seg" id="layouts">
              <button data-layout="horizontal" aria-pressed="true">Horizontal</button>
              <button data-layout="vertical" aria-pressed="false">Vertical</button>
            </div>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Nó</span>
          <div class="stats">
            <div><b id="m-children">0</b><span>filhos</span></div>
            <div><b id="m-depth">0</b><span>nível</span></div>
            <div><b id="m-size">—</b><span>tamanho</span></div>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Atalhos</span>
          <div class="keys">
            <div class="keys-row"><span>Adicionar filho</span><kbd>Tab</kbd></div>
            <div class="keys-row"><span>Adicionar irmão</span><kbd>↵</kbd></div>
            <div class="keys-row"><span>Excluir</span><kbd>⌫</kbd></div>
            <div class="keys-row"><span>Dobrar</span><kbd>Space</kbd></div>
            <div class="keys-row"><span>Desfazer</span><kbd>⌘Z</kbd></div>
          </div>
        </div>

        <div class="banner" id="nodestatus">— nós no mapa</div>
      </div>
    </aside>
  </div>

  <!-- ── folha de temas, como o .drawer / theme-grid do Ideario ──────── -->
  <div class="overlay" id="theme-overlay" hidden></div>
  <div class="theme-sheet" id="theme-sheet" hidden>
    <div class="theme-sheet-head">
      <span class="brand-name" style="font-size:18px">Tema</span>
      <button class="icon-btn sm" id="theme-close" title="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="theme-sheet-body">
      <div class="theme-group-label">Paleta</div>
      <div class="theme-grid" id="palette-grid" role="radiogroup" aria-label="Tema"></div>

      <div id="desktop-wrap" hidden>
        <div class="theme-group-label">Imitar área de trabalho</div>
        <div class="theme-grid" id="desktop-grid" role="radiogroup" aria-label="Área de trabalho"></div>
      </div>

      <div class="theme-group-label">Aparência</div>
      <div class="seg" id="mode-seg">
        <button data-mode="system" aria-pressed="true">Sistema</button>
        <button data-mode="light" aria-pressed="false">Claro</button>
        <button data-mode="dark" aria-pressed="false">Escuro</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { PALETTES, DESKTOPS, paletteColors, systemColors, cssVars } from "./theme.js";

/* ══════════════════════════════════════════════════════════════════════════
   Renderer do protótipo.

   O layout espelha crates/nodo-core/src/layout.rs (H_GAP=68, V_GAP=16),
   então o que você aprova aqui é o que o app Rust desenha.

   Cores de nó: uso os tokens --n-* do Ideario (as cores dos cards dele), não
   uma paleta inventada. Assim os dois apps compartilham o mesmo vocabulário.
   ══════════════════════════════════════════════════════════════════════════ */

const NODE_COLORS = ["--n-sand", "--n-sage", "--n-sky", "--n-rose", "--n-lilac", "--n-butter"];

let nextId = 0;
function node(text, opts = {}) {
  return {
    id: nextId++,
    text,
    note: opts.note || "",
    color: opts.color || null,
    side: opts.side || "right",
    layout: "horizontal",
    folded: false,
    children: opts.children || [],
    x: 0, y: 0, w: 0, h: 0, depth: 0,
  };
}

const root = node("Product Roadmap", {
  note: "Planejamento Q4. **Owner:** time de plataforma.",
  children: [
    node("Discovery", {
      color: "--n-sky",
      note: "Entrevistas com clientes, enquadramento do problema.",
      children: [
        node("Entrevistas", { color: "--n-sky" }),
        node("Análise de mercado", { color: "--n-sky" }),
        node("Problem brief", { color: "--n-sky", note: "Uma página, no máximo." }),
      ],
    }),
    node("Design", {
      color: "--n-lilac",
      children: [
        node("Wireframes", { color: "--n-lilac" }),
        node("Design system", {
          color: "--n-lilac",
          children: [
            node("Tokens", { color: "--n-lilac" }),
            node("Componentes", { color: "--n-lilac" }),
          ],
        }),
        node("Protótipo", { color: "--n-lilac" }),
      ],
    }),
    node("Build", {
      color: "--n-sage",
      children: [
        node("Core model", { color: "--n-sage", note: "Compartilhado entre app e MCP." }),
        node("Layout engine", { color: "--n-sage" }),
        node("Servidor MCP", {
          color: "--n-sage",
          children: [
            node("16 ferramentas", { color: "--n-sage" }),
            node("Ponte de undo", { color: "--n-sage" }),
          ],
        }),
        node("Shell desktop", { color: "--n-sage" }),
      ],
    }),
    node("Lançamento", {
      color: "--n-sand",
      children: [
        node("Beta", { color: "--n-sand" }),
        node("Documentação", { color: "--n-sand" }),
        node("v1.0", { color: "--n-sand" }),
      ],
    }),
    node("Pesquisa", {
      side: "left",
      color: "--n-rose",
      children: [
        node("Concorrentes", { side: "left", color: "--n-rose" }),
        node("Artigos", { side: "left", color: "--n-rose" }),
      ],
    }),
  ],
});

/* ── layout (espelha nodo-core) ─────────────────────────────────────── */
const CHAR_W = 7.6;
const MIN_W = 84;
const MIN_H = 44;
const H_GAP = 68;
const V_GAP = 16;

function measure(n) {
  const lines = n.text.split("\n");
  const longest = Math.max(...lines.map((l) => l.length), 1);
  n.w = Math.max(MIN_W, longest * CHAR_W + 36);
  n.h = Math.max(MIN_H, lines.length * 19 + 22);
}

function layoutAll(n, depth = 0) {
  n.depth = depth;
  measure(n);
  for (const c of n.children) layoutAll(c, depth + 1);
}

function place(n, x, y) {
  n.x = x; n.y = y;
  if (n.children.length === 0 || n.folded) return n.h;
  const dir = n.side === "left" ? -1 : 1;
  const childX = x + dir * (n.w + H_GAP);
  let cursor = y;
  const start = cursor;
  for (const c of n.children) cursor += place(c, childX, cursor) + V_GAP;
  const total = Math.max(cursor - V_GAP - start, n.h);
  n.y = start + (total - n.h) / 2;
  return total;
}

function flat(n, out = [], parent = null) {
  out.push({ ...n, parent: parent ? parent.id : null });
  for (const c of n.children) flat(c, out, n);
  return out;
}

/* ── estado ───────────────────────────────────────────────────────────── */
let nodes = [];
let selectedId = 0;
const view = { x: 0, y: 0, scale: 1 };

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");

function rebuild() {
  layoutAll(root);
  place(root, 0, 0);
  nodes = flat(root);
  document.getElementById("nodestatus").textContent = nodes.length + " nós no mapa";
}
function cssv(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function byId(id) { return nodes.find((n) => n.id === id); }
function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h);
  }
  return { x0, y0, x1, y1 };
}

/* ── desenho ──────────────────────────────────────────────────────────── */
let dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = stage.getBoundingClientRect();
  canvas.width = Math.floor(r.width * dpr);
  canvas.height = Math.floor(r.height * dpr);
  canvas.style.width = r.width + "px";
  canvas.style.height = r.height + "px";
  draw();
}
const sx = (x) => x * view.scale + view.x;
const sy = (y) => y * view.scale + view.y;

function draw() {
  const r = stage.getBoundingClientRect();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);

  for (const n of nodes) {
    if (n.parent === null) continue;
    const p = byId(n.parent);
    if (p) drawBranch(p, n);
  }
  for (const n of nodes) drawNode(n);
}

function drawBranch(parent, child) {
  const left = child.side === "left";
  const ax = left ? parent.x : parent.x + parent.w;
  const ay = parent.y + parent.h / 2;
  const bx = left ? child.x + child.w : child.x;
  const by = child.y + child.h / 2;

  ctx.save();
  ctx.strokeStyle = child.color ? cssv(child.color) : cssv("--line");
  ctx.lineWidth = Math.max(1.5, 2.4 * view.scale);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(sx(ax), sy(ay));
  const mid = (sx(ax) + sx(bx)) / 2;
  ctx.bezierCurveTo(mid, sy(ay), mid, sy(by), sx(bx), sy(by));
  ctx.stroke();
  ctx.restore();
}

function drawNode(n) {
  const x = sx(n.x), y = sy(n.y), w = n.w * view.scale, h = n.h * view.scale;
  const isRoot = n.parent === null;
  const selected = n.id === selectedId;
  const radius = Math.min(14, h * 0.34);

  ctx.save();

  // O card do Ideario: fundo de superfície, contorno translúcido, raio 16.
  roundRect(x, y, w, h, radius);
  if (isRoot) {
    ctx.fillStyle = cssv("--accent");
    ctx.fill();
    ctx.shadowColor = "color-mix(in oklab, " + cssv("--accent") + " 35%, transparent)";
    ctx.shadowBlur = 16 * view.scale;
    ctx.shadowOffsetY = 3 * view.scale;
    ctx.fill();
    ctx.shadowColor = "transparent";
  } else {
    ctx.fillStyle = n.color ? cssv(n.color) : cssv("--surface");
    ctx.fill();
  }

  // Contorno: --card-edge do Ideario, ou --accent quando selecionado.
  roundRect(x, y, w, h, radius);
  if (selected) {
    ctx.strokeStyle = cssv("--accent");
    ctx.lineWidth = 2;
    ctx.stroke();
  } else {
    ctx.strokeStyle = cssv("--card-edge");
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Rótulo
  const fs = Math.max(9.5, 13.5 * view.scale);
  ctx.font = `${isRoot ? 700 : 600} ${fs}px ${cssv("--font-body")}`;
  ctx.fillStyle = isRoot ? cssv("--on-accent") : cssv("--fg");
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(fitText(n.text, w - 22), x + w / 2, y + h / 2);

  // Marcador de nota: bolinha discreta, como o .dot do Ideario
  if (n.note) {
    ctx.beginPath();
    ctx.arc(x + w - 8, y + 8, 2.8, 0, Math.PI * 2);
    ctx.fillStyle = isRoot ? "rgba(255,255,255,.85)" : cssv("--muted");
    ctx.fill();
  }

  // Ramo dobrado
  if (n.children.length && n.folded) {
    ctx.beginPath();
    ctx.arc(x + w + 8, y + h / 2, 5, 0, Math.PI * 2);
    ctx.fillStyle = cssv("--accent");
    ctx.fill();
    ctx.strokeStyle = cssv("--stage");
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fitText(text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}

/* ── viewport ─────────────────────────────────────────────────────────── */
function fitView(animate = false) {
  const b = bounds();
  const r = stage.getBoundingClientRect();
  const pad = 110;
  const w = b.x1 - b.x0 || 1, h = b.y1 - b.y0 || 1;
  const target = Math.max(0.12, Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h, 1.35));
  const to = {
    scale: target,
    x: r.width / 2 - ((b.x0 + b.x1) / 2) * target,
    y: r.height / 2 - ((b.y0 + b.y1) / 2) * target,
  };
  if (!animate) { Object.assign(view, to); updateZoom(); draw(); return; }
  const from = { ...view }, t0 = performance.now(), dur = 320;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    view.scale = from.scale + (to.scale - from.scale) * e;
    view.x = from.x + (to.x - from.x) * e;
    view.y = from.y + (to.y - from.y) * e;
    updateZoom(); draw();
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function updateZoom() { document.getElementById("zoomlevel").textContent = Math.round(view.scale * 100) + "%"; }
function zoomBy(f, cx, cy) {
  const r = stage.getBoundingClientRect();
  const px = cx ?? r.width / 2, py = cy ?? r.height / 2;
  const wx = (px - view.x) / view.scale, wy = (py - view.y) / view.scale;
  view.scale = Math.min(4, Math.max(0.1, view.scale * f));
  view.x = px - wx * view.scale;
  view.y = py - wy * view.scale;
  updateZoom(); draw();
}

/* ── interação ────────────────────────────────────────────────────────── */
function hit(cx, cy) {
  const r = stage.getBoundingClientRect();
  const wx = (cx - r.left - view.x) / view.scale;
  const wy = (cy - r.top - view.y) / view.scale;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (wx >= n.x && wx <= n.x + n.w && wy >= n.y && wy <= n.y + n.h) return n;
  }
  return null;
}

let panning = null;
canvas.addEventListener("mousedown", (e) => {
  const n = hit(e.clientX, e.clientY);
  if (n) { select(n.id); return; }
  panning = { x: e.clientX - view.x, y: e.clientY - view.y };
  stage.classList.add("panning");
});
window.addEventListener("mousemove", (e) => {
  if (!panning) return;
  view.x = e.clientX - panning.x;
  view.y = e.clientY - panning.y;
  draw();
});
window.addEventListener("mouseup", () => { panning = null; stage.classList.remove("panning"); });
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
canvas.addEventListener("dblclick", (e) => {
  const n = hit(e.clientX, e.clientY);
  if (n) { select(n.id); document.getElementById("text").focus(); }
});
window.addEventListener("resize", resize);

/* ── inspetor ─────────────────────────────────────────────────────────── */
function select(id) {
  selectedId = id;
  const n = byId(id);
  if (!n) return;
  document.getElementById("nodeid").textContent = "#" + n.id;
  document.getElementById("text").value = n.text;
  document.getElementById("note").value = n.note;
  document.getElementById("m-children").textContent = n.children.length;
  document.getElementById("m-depth").textContent = n.depth;
  document.getElementById("m-size").textContent = Math.round(n.w) + "×" + Math.round(n.h);
  for (const b of document.querySelectorAll("#sides button"))
    b.setAttribute("aria-pressed", String(b.dataset.side === n.side));
  for (const b of document.querySelectorAll("#layouts button"))
    b.setAttribute("aria-pressed", String(b.dataset.layout === n.layout));
  for (const s of document.querySelectorAll(".swatch"))
    s.setAttribute("aria-pressed", String(s.dataset.color === (n.color || "")));
  draw();
}

const swatchBox = document.getElementById("swatches");
const noneBtn = document.createElement("button");
noneBtn.className = "swatch swatch--none";
noneBtn.dataset.color = "";
noneBtn.textContent = "×";
noneBtn.title = "Sem cor";
noneBtn.onclick = () => setColor(null);
swatchBox.appendChild(noneBtn);
for (const token of NODE_COLORS) {
  const b = document.createElement("button");
  b.className = "swatch";
  b.dataset.color = token;
  b.style.background = `var(${token})`;
  b.onclick = () => setColor(token);
  swatchBox.appendChild(b);
}
function setColor(token) {
  const n = byId(selectedId);
  if (!n) return;
  n.color = token;
  select(selectedId);
}

document.getElementById("text").addEventListener("input", (e) => {
  const n = byId(selectedId);
  if (!n) return;
  n.text = e.target.value || " ";
  rebuild(); select(selectedId);
});
document.getElementById("note").addEventListener("input", (e) => {
  const n = byId(selectedId);
  if (!n) return;
  n.note = e.target.value;
  select(selectedId);
});
for (const b of document.querySelectorAll("#sides button"))
  b.onclick = () => {
    const n = byId(selectedId);
    if (!n) return;
    n.side = b.dataset.side;
    rebuild(); select(selectedId);
  };
for (const b of document.querySelectorAll("#layouts button"))
  b.onclick = () => {
    const n = byId(selectedId);
    if (!n) return;
    n.layout = b.dataset.layout;
    select(selectedId);
  };

document.getElementById("zoom-in").onclick = () => zoomBy(1.2);
document.getElementById("zoom-out").onclick = () => zoomBy(1 / 1.2);
document.getElementById("zoom-fit").onclick = () => fitView(true);

/* ── tema: 5 paletas + Sistema, claro/escuro, como o Ideario ──────────── */

const MODE_KEY = "nodo.theme";
const PALETTE_KEY = "nodo.palette";
const SIM_KEY = "nodo.simDesktop";

const load = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const store = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

const state = {
  pref: (() => { const v = load(MODE_KEY); return v === "light" || v === "dark" ? v : "system"; })(),
  palette: (() => {
    const v = load(PALETTE_KEY);
    return v === "system" || (v && v in PALETTES) ? v : "ideario";
  })(),
  simDesktop: (() => {
    const saved = load(SIM_KEY);
    if (saved && saved in DESKTOPS) return saved;
    const ua = navigator.userAgent;
    return /Mac/.test(ua) ? "macos" : /Windows/.test(ua) ? "windows" : "gnome";
  })(),
};

const darkQuery = typeof matchMedia === "function" ? matchMedia("(prefers-color-scheme: dark)") : null;
let osDark = darkQuery?.matches ?? false;

const mode = () => (state.pref === "system" ? (osDark ? "dark" : "light") : state.pref);

function applyTheme() {
  const m = mode();
  const colors = paletteColors(state.palette, m, state.simDesktop, null);
  const vars = cssVars(colors, m);
  for (const [k, v] of Object.entries(vars)) {
    document.documentElement.style.setProperty(k, v);
  }
  document.documentElement.style.colorScheme = m;
  document.getElementById("theme-label").textContent =
    state.palette === "system" ? DESKTOPS[state.simDesktop].label : PALETTES[state.palette].label;

  // Ícone do modo: sol no claro, lua no escuro.
  document.getElementById("mode-icon").innerHTML = m === "dark"
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';

  for (const b of document.querySelectorAll("#mode-seg button"))
    b.setAttribute("aria-pressed", String(b.dataset.mode === state.pref));

  document.getElementById("desktop-wrap").hidden = state.palette !== "system";
  renderPaletteGrid();
  renderDesktopGrid();
  draw();
}

/* Miniaturas: mostram bg, card e as cores de nota, como o theme-tile do Ideario. */
function tileFor(id, m) {
  const c = id === "system"
    ? systemColors(state.simDesktop, m, null)
    : PALETTES[id][m];
  const el = document.createElement("button");
  el.className = "theme-tile";
  el.setAttribute("role", "radio");
  el.setAttribute("aria-checked", String(state.palette === id));
  el.innerHTML = `
    <span class="theme-swatch" style="background:${c.bg}">
      <span class="theme-card" style="background:${c.surface};border-color:${c.line}"></span>
      <span class="theme-dots">
        ${c.notes.slice(0, 4).map((n) => `<i style="background:${n}"></i>`).join("")}
      </span>
    </span>
    <span class="theme-name">${id === "system" ? "Sistema" : PALETTES[id].label}</span>
    <span class="theme-hint">${id === "system" ? "Segue a área de trabalho" : PALETTES[id].hint}</span>`;
  el.onclick = () => { state.palette = id; store(PALETTE_KEY, id); applyTheme(); };
  return el;
}

function renderPaletteGrid() {
  const grid = document.getElementById("palette-grid");
  const m = mode();
  grid.innerHTML = "";
  grid.appendChild(tileFor("system", m));
  for (const id of Object.keys(PALETTES)) grid.appendChild(tileFor(id, m));
}

function renderDesktopGrid() {
  const grid = document.getElementById("desktop-grid");
  const m = mode();
  grid.innerHTML = "";
  for (const id of Object.keys(DESKTOPS)) {
    const el = document.createElement("button");
    el.className = "theme-tile";
    el.setAttribute("role", "radio");
    el.setAttribute("aria-checked", String(state.simDesktop === id));
    const c = DESKTOPS[id][m];
    el.innerHTML = `
      <span class="theme-swatch" style="background:${c.bg}">
        <span class="theme-card" style="background:${c.surface};border-color:${c.line}"></span>
        <span class="theme-dots">
          ${c.notes.slice(0, 4).map((n) => `<i style="background:${n}"></i>`).join("")}
        </span>
      </span>
      <span class="theme-name">${DESKTOPS[id].label}</span>
      <span class="theme-hint">Destaque ${c.accent}</span>`;
    el.onclick = () => { state.simDesktop = id; store(SIM_KEY, id); applyTheme(); };
    grid.appendChild(el);
  }
}

/* Abrir e fechar a folha */
const sheet = document.getElementById("theme-sheet");
const overlay = document.getElementById("theme-overlay");
const openSheet = () => { sheet.hidden = false; overlay.hidden = false; };
const closeSheet = () => { sheet.hidden = true; overlay.hidden = true; };

document.getElementById("theme-open").onclick = openSheet;
document.getElementById("theme-close").onclick = closeSheet;
overlay.onclick = closeSheet;
window.addEventListener("keydown", (e) => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

/* Alternar claro/escuro direto na barra */
document.getElementById("mode-toggle").onclick = () => {
  state.pref = mode() === "dark" ? "light" : "dark";
  store(MODE_KEY, state.pref);
  applyTheme();
};

for (const b of document.querySelectorAll("#mode-seg button")) {
  b.onclick = () => { state.pref = b.dataset.mode; store(MODE_KEY, state.pref); applyTheme(); };
}

darkQuery?.addEventListener("change", (e) => {
  osDark = e.matches;
  if (state.pref === "system") applyTheme();
});

/* ── boot ─────────────────────────────────────────────────────────────── */
rebuild();
resize();
fitView();
select(0);
applyTheme();
</script>
</body>
</html>
