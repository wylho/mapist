<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nodo — visual prototype</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Nodo visual prototype.

   This file is the design sandbox. It renders a real mind map with the same
   layout maths as nodo-core, using hard-coded sample data, so the visual
   language can be iterated without rebuilding the Rust app.

   Design tokens live in :root. Change them there, not inline.
   ══════════════════════════════════════════════════════════════════════════ */

:root {
  /* Surfaces — a calm, slightly warm dark that keeps coloured branches vivid */
  --bg:            #14161a;
  --bg-grid:       #1a1d23;
  --panel:         #1b1e24;
  --panel-raised:  #22262e;
  --panel-hover:   #2a2f38;
  --border:        #2e333d;
  --border-strong: #3d434f;

  /* Text */
  --text:          #e8eaee;
  --text-muted:    #9ba3b0;
  --text-faint:    #6b7280;

  /* Accent */
  --accent:        #5b9dff;
  --accent-soft:   rgba(91, 157, 255, 0.15);
  --accent-glow:   rgba(91, 157, 255, 0.35);

  /* Branch palette — Minder's colours, slightly desaturated for dark mode */
  --c1: #e35d6a;
  --c2: #f08c3a;
  --c3: #e8c547;
  --c4: #6fc46f;
  --c5: #5b9dff;
  --c6: #b07de8;
  --c7: #4fc4c4;

  --radius-sm: 5px;
  --radius:    8px;
  --radius-lg: 12px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow:    0 4px 16px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.5);

  --font-ui: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --font-node: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

  --toolbar-h: 52px;
  --inspector-w: 300px;
}

/* Light theme, same token names so nothing else changes. */
:root[data-theme="light"] {
  --bg:            #f4f5f7;
  --bg-grid:       #eceef2;
  --panel:         #ffffff;
  --panel-raised:  #f7f8fa;
  --panel-hover:   #eef0f4;
  --border:        #e0e3e9;
  --border-strong: #c9ced8;
  --text:          #1a1d23;
  --text-muted:    #5f6773;
  --text-faint:    #8b93a0;
  --accent:        #2f7ce8;
  --accent-soft:   rgba(47, 124, 232, 0.10);
  --accent-glow:   rgba(47, 124, 232, 0.25);
  --c1: #d64550;
  --c2: #e07b28;
  --c3: #d4ad2a;
  --c4: #4fae4f;
  --c5: #2f7ce8;
  --c6: #9257d4;
  --c7: #2fa8a8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --shadow:    0 4px 16px rgba(0,0,0,.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  font: 13px/1.5 var(--font-ui);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

/* ── app shell ─────────────────────────────────────────────────────────── */

.app {
  display: grid;
  grid-template-rows: var(--toolbar-h) 1fr;
  grid-template-columns: 1fr var(--inspector-w);
  grid-template-areas:
    "toolbar toolbar"
    "stage   inspector";
  height: 100%;
}

/* ── toolbar ───────────────────────────────────────────────────────────── */

.toolbar {
  grid-area: toolbar;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.toolbar__brand {
  display: flex;
  align-items: center;
  gap: 9px;
  padding-right: 14px;
  margin-right: 6px;
  border-right: 1px solid var(--border);
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.toolbar__mark {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--accent), var(--c6));
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-sm);
}

.toolbar__mark svg { width: 13px; height: 13px; }

.tbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  transition: background .12s, color .12s;
  white-space: nowrap;
}

.tbtn:hover { background: var(--panel-hover); color: var(--text); }
.tbtn:active { transform: translateY(1px); }
.tbtn[disabled] { opacity: .35; pointer-events: none; }
.tbtn svg { width: 15px; height: 15px; flex: none; }
.tbtn--icon { padding: 0; width: 32px; justify-content: center; }

.tsep { width: 1px; height: 22px; background: var(--border); margin: 0 6px; flex: none; }
.tspacer { flex: 1; }

.search {
  position: relative;
  display: flex;
  align-items: center;
}

.search svg {
  position: absolute;
  left: 9px;
  width: 14px;
  height: 14px;
  color: var(--text-faint);
  pointer-events: none;
}

.search input {
  font: inherit;
  color: var(--text);
  background: var(--panel-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  height: 32px;
  width: 200px;
  padding: 0 10px 0 30px;
  outline: none;
  transition: border-color .12s, background .12s, width .2s;
}

.search input::placeholder { color: var(--text-faint); }
.search input:focus { border-color: var(--accent); background: var(--panel); width: 250px; }

.status {
  color: var(--text-faint);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c3);
  flex: none;
}

/* ── stage ─────────────────────────────────────────────────────────────── */

.stage {
  grid-area: stage;
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  /* A whisper of texture so the canvas does not read as a dead rectangle. */
  background-image:
    radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 0);
  background-size: 22px 22px;
}

.stage canvas { display: block; width: 100%; height: 100%; cursor: default; }
.stage.panning canvas { cursor: grabbing; }

/* Floating controls, bottom-right, like a design tool. */
.zoombar {
  position: absolute;
  right: 16px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.zoombar button {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
}

.zoombar button:hover { background: var(--panel-hover); color: var(--text); }
.zoombar svg { width: 14px; height: 14px; }

.zoomlevel {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
  min-width: 42px;
  text-align: center;
  user-select: none;
}

/* ── inspector ─────────────────────────────────────────────────────────── */

.inspector {
  grid-area: inspector;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.inspector__head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.inspector__title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.badge {
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid transparent;
}

.inspector__body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.inspector__body::-webkit-scrollbar { width: 10px; }
.inspector__body::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 10px;
  border: 3px solid var(--panel);
}

.field { display: flex; flex-direction: column; gap: 7px; }

.field__label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-faint);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.field__hint { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-faint); }

.field textarea,
.field input[type="text"] {
  font: inherit;
  color: var(--text);
  background: var(--panel-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  resize: vertical;
  outline: none;
  transition: border-color .12s, box-shadow .12s;
  width: 100%;
}

.field textarea:focus,
.field input[type="text"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.field textarea::placeholder { color: var(--text-faint); }

/* Colour swatches */
.swatches { display: flex; gap: 7px; flex-wrap: wrap; }

.swatch {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  border: 2px solid transparent;
  position: relative;
  transition: transform .12s, border-color .12s;
}

.swatch:hover { transform: scale(1.12); }
.swatch[aria-pressed="true"] {
  border-color: var(--text);
  box-shadow: 0 0 0 2px var(--panel);
}

.swatch--none {
  background: var(--panel-raised);
  border: 2px dashed var(--border-strong);
  display: grid;
  place-items: center;
  color: var(--text-faint);
  font-size: 13px;
}

/* Segmented control */
.segmented {
  display: flex;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 2px;
}

.segmented button {
  flex: 1;
  padding: 6px 4px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--text-muted);
  transition: background .12s, color .12s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.segmented button:hover { color: var(--text); }
.segmented button[aria-pressed="true"] {
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

.segmented svg { width: 13px; height: 13px; }

/* Metadata table */
.meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 12px; }
.meta dt { color: var(--text-faint); }
.meta dd { color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: right; }

/* Keyboard hints */
.keys {
  margin-top: auto;
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: grid;
  gap: 7px;
}

.keys__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
}

kbd {
  font: 11px/1 var(--font-mono);
  background: var(--panel-raised);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 3px 6px;
  color: var(--text-muted);
  min-width: 20px;
  text-align: center;
  display: inline-block;
}

/* ── prototype banner ──────────────────────────────────────────────────── */

.proto {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 6px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 30px;
  box-shadow: var(--shadow);
  font-size: 12px;
  color: var(--text-muted);
  z-index: 20;
  white-space: nowrap;
}

.proto strong { color: var(--text); font-weight: 600; }

.proto__themes { display: flex; gap: 2px; background: var(--panel-raised); border-radius: 20px; padding: 2px; }
.proto__themes button {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  color: var(--text-muted);
}
.proto__themes button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow-sm); }
</style>
</head>
<body>

<div class="app">

  <!-- ── toolbar ──────────────────────────────────────────────────────── -->
  <header class="toolbar">
    <div class="toolbar__brand">
      <div class="toolbar__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 9V4M12 15v5M9 12H4M15 12h5"/>
        </svg>
      </div>
      <span>Nodo</span>
    </div>

    <button class="tbtn" title="New map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New
    </button>
    <button class="tbtn" title="Open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Open
    </button>
    <button class="tbtn" title="Save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      Save
    </button>

    <div class="tsep"></div>

    <button class="tbtn" title="Add child (Tab)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="2" y="16" width="6" height="5" rx="1.5"/><rect x="16" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M5 16v-2h14v2"/></svg>
      Add child
    </button>
    <button class="tbtn" title="Delete node (Del)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>

    <div class="tsep"></div>

    <button class="tbtn tbtn--icon" title="Undo (⌘Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.1-9.4L3 7"/></svg>
    </button>
    <button class="tbtn tbtn--icon" title="Redo (⌘⇧Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M20.5 13a9 9 0 1 1-2.1-9.4L21 7"/></svg>
    </button>

    <div class="tsep"></div>

    <button class="tbtn tbtn--icon" title="Fold branch (Space)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>
    </button>

    <div class="tspacer"></div>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Search nodes…" />
    </label>

    <div class="tsep"></div>

    <div class="status">
      <span class="dot"></span>
      <span>product-roadmap.minder</span>
      <span style="color:var(--border-strong)">·</span>
      <span id="nodecount">— nodes</span>
    </div>
  </header>

  <!-- ── stage ────────────────────────────────────────────────────────── -->
  <main class="stage" id="stage">
    <canvas id="canvas"></canvas>

    <div class="proto">
      <span><strong>Prototype</strong> — sample data</span>
      <div class="proto__themes">
        <button id="theme-dark" aria-pressed="true">Dark</button>
        <button id="theme-light" aria-pressed="false">Light</button>
      </div>
    </div>

    <div class="zoombar">
      <button id="zoom-out" title="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <span class="zoomlevel" id="zoomlevel">100%</span>
      <button id="zoom-in" title="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="zoom-fit" title="Fit to screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M16 21h3a2 2 0 0 0 2-2v-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
    </div>
  </main>

  <!-- ── inspector ────────────────────────────────────────────────────── -->
  <aside class="inspector">
    <div class="inspector__head">
      <span class="inspector__title">Inspector</span>
      <span class="badge" id="nodeid">#0</span>
    </div>

    <div class="inspector__body">
      <div class="field">
        <label class="field__label" for="text">Text</label>
        <textarea id="text" rows="2" placeholder="Node text"></textarea>
      </div>

      <div class="field">
        <label class="field__label" for="note">Note <span class="field__hint">markdown</span></label>
        <textarea id="note" rows="5" placeholder="Add a note…"></textarea>
      </div>

      <div class="field">
        <span class="field__label">Branch colour</span>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="field">
        <span class="field__label">Side</span>
        <div class="segmented" id="sides">
          <button data-side="left" aria-pressed="false">Left</button>
          <button data-side="right" aria-pressed="true">Right</button>
        </div>
      </div>

      <div class="field">
        <span class="field__label">Layout</span>
        <div class="segmented" id="layouts">
          <button data-layout="horizontal" aria-pressed="true">Horizontal</button>
          <button data-layout="vertical" aria-pressed="false">Vertical</button>
        </div>
      </div>

      <div class="field">
        <span class="field__label">Node</span>
        <dl class="meta">
          <dt>Children</dt><dd id="m-children">0</dd>
          <dt>Depth</dt><dd id="m-depth">0</dd>
          <dt>Size</dt><dd id="m-size">—</dd>
        </dl>
      </div>
    </div>

    <div class="keys">
      <div class="keys__row"><span>Add child</span><kbd>Tab</kbd></div>
      <div class="keys__row"><span>Add sibling</span><kbd>↵</kbd></div>
      <div class="keys__row"><span>Delete</span><kbd>⌫</kbd></div>
      <div class="keys__row"><span>Fold</span><kbd>Space</kbd></div>
      <div class="keys__row"><span>Undo</span><kbd>⌘Z</kbd></div>
    </div>
  </aside>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   Prototype renderer.

   Mirrors the layout maths in crates/nodo-core/src/layout.rs so what you
   see here is what the Rust app draws. Sample data stands in for the file.
   ══════════════════════════════════════════════════════════════════════════ */

const PALETTE = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c7"];

/* ── sample map ───────────────────────────────────────────────────────── */

let nextId = 0;
function node(text, opts = {}) {
  return {
    id: nextId++,
    text,
    note: opts.note || "",
    color: opts.color || null,
    side: opts.side || "right",
    layout: "horizontal",
    folded: false,
    children: (opts.children || []).map((c) => c),
    x: 0, y: 0, w: 0, h: 0, depth: 0,
  };
}

const root = node("Product Roadmap", {
  note: "Q4 planning. **Owner:** platform team.",
  children: [
    node("Discovery", {
      color: "--c5",
      note: "Customer interviews, problem framing.",
      children: [
        node("User interviews", { color: "--c5" }),
        node("Market scan", { color: "--c5" }),
        node("Problem brief", { color: "--c5", note: "One page max." }),
      ],
    }),
    node("Design", {
      color: "--c6",
      children: [
        node("Wireframes", { color: "--c6" }),
        node("Design system", {
          color: "--c6",
          children: [
            node("Tokens", { color: "--c6" }),
            node("Components", { color: "--c6" }),
          ],
        }),
        node("Prototype", { color: "--c6" }),
      ],
    }),
    node("Build", {
      color: "--c4",
      children: [
        node("Core model", { color: "--c4", note: "Shared by app and MCP." }),
        node("Layout engine", { color: "--c4" }),
        node("MCP server", {
          color: "--c4",
          children: [
            node("16 tools", { color: "--c4" }),
            node("Undo bridge", { color: "--c4" }),
          ],
        }),
        node("Desktop shell", { color: "--c4" }),
      ],
    }),
    node("Launch", {
      color: "--c2",
      children: [
        node("Beta", { color: "--c2" }),
        node("Docs", { color: "--c2" }),
        node("v1.0", { color: "--c2" }),
      ],
    }),
  ],
});

/* A couple of branches on the left, to exercise two-sided layout. */
const leftBranch = node("Research", {
  side: "left",
  color: "--c7",
  children: [
    node("Competitors", { side: "left", color: "--c7" }),
    node("Papers", { side: "left", color: "--c7" }),
  ],
});
root.children.push(leftBranch);

/* ── layout (mirrors nodo-core) ─────────────────────────────────────── */

const CHAR_W = 7.4;
const MIN_W = 63;
const MIN_H = 42;
const H_GAP = 68;
const V_GAP = 16;

function measure(n) {
  const lines = n.text.split("\n");
  const longest = Math.max(...lines.map((l) => l.length), 1);
  n.w = Math.max(MIN_W, longest * CHAR_W + 34);
  n.h = Math.max(MIN_H, lines.length * 18 + 20);
}

function layoutAll(n, depth = 0) {
  n.depth = depth;
  measure(n);
  for (const c of n.children) layoutAll(c, depth + 1);
}

function place(n, x, y) {
  n.x = x;
  n.y = y;

  if (n.children.length === 0 || n.folded) return n.h;

  const dir = n.side === "left" ? -1 : 1;
  const childX = x + dir * (n.w + H_GAP);
  let cursor = y;
  const start = cursor;
  for (const c of n.children) {
    cursor += place(c, childX, cursor) + V_GAP;
  }
  const total = Math.max(cursor - V_GAP - start, n.h);
  n.y = start + (total - n.h) / 2;
  return total;
}

function flat(n, out = [], parent = null) {
  out.push({ ...n, parent: parent ? parent.id : null });
  for (const c of n.children) flat(c, out, n);
  return out;
}

/* ── state ────────────────────────────────────────────────────────────── */

let nodes = [];
let selectedId = 0;
const view = { x: 0, y: 0, scale: 1 };

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");

function rebuild() {
  layoutAll(root);
  place(root, 0, 0);
  nodes = flat(root);
  document.getElementById("nodecount").textContent = nodes.length + " nodes";
}

function cssv(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function byId(id) {
  return nodes.find((n) => n.id === id);
}

function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    x0 = Math.min(x0, n.x);
    y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + n.w);
    y1 = Math.max(y1, n.y + n.h);
  }
  return { x0, y0, x1, y1 };
}

/* ── drawing ──────────────────────────────────────────────────────────── */

let dpr = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = stage.getBoundingClientRect();
  canvas.width = Math.floor(r.width * dpr);
  canvas.height = Math.floor(r.height * dpr);
  canvas.style.width = r.width + "px";
  canvas.style.height = r.height + "px";
  draw();
}

function sx(x) { return x * view.scale + view.x; }
function sy(y) { return y * view.scale + view.y; }

function draw() {
  const r = stage.getBoundingClientRect();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);

  // Branch connectors, drawn first so nodes sit on top.
  for (const n of nodes) {
    if (n.parent === null) continue;
    const p = byId(n.parent);
    if (!p) continue;
    drawBranch(p, n);
  }

  for (const n of nodes) drawNode(n);
}

function drawBranch(parent, child) {
  const left = child.side === "left";
  const ax = left ? parent.x : parent.x + parent.w;
  const ay = parent.y + parent.h / 2;
  const bx = left ? child.x + child.w : child.x;
  const by = child.y + child.h / 2;

  const stroke = child.color ? cssv(child.color) : cssv("--border-strong");

  ctx.save();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = Math.max(1.5, 2.6 * view.scale);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(sx(ax), sy(ay));
  // A flat S-curve reads cleaner than a straight line for tree branches.
  const mid = (sx(ax) + sx(bx)) / 2;
  ctx.bezierCurveTo(mid, sy(ay), mid, sy(by), sx(bx), sy(by));
  ctx.stroke();
  ctx.restore();
}

function drawNode(n) {
  const x = sx(n.x);
  const y = sy(n.y);
  const w = n.w * view.scale;
  const h = n.h * view.scale;
  const selected = n.id === selectedId;
  const radius = Math.min(9, h * 0.28);

  const isRoot = n.parent === null;
  const accent = n.color ? cssv(n.color) : cssv("--border-strong");

  ctx.save();

  // Root gets a filled treatment so the eye lands on it first.
  if (isRoot) {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, cssv("--accent"));
    g.addColorStop(1, cssv("--c6"));
    roundRect(x, y, w, h, radius);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowColor = cssv("--accent-glow");
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 3;
    ctx.fill();
    ctx.shadowColor = "transparent";
  } else {
    roundRect(x, y, w, h, radius);
    ctx.fillStyle = cssv("--panel-raised");
    ctx.fill();

    // A tinted wash plus a solid left edge carries the branch colour without
    // shouting.
    if (n.color) {
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = cssv(n.color);
      ctx.fill();
      ctx.restore();
    }
  }

  // Border
  roundRect(x, y, w, h, radius);
  if (selected) {
    ctx.strokeStyle = cssv("--accent");
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // Selection halo
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = cssv("--accent-glow");
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.restore();
  } else if (isRoot) {
    ctx.strokeStyle = "transparent";
  } else {
    ctx.strokeStyle = n.color ? cssv(n.color) : cssv("--border-strong");
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.75;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Colour rail on the leading edge
  if (n.color && !isRoot) {
    ctx.save();
    roundRect(x, y, w, h, radius);
    ctx.clip();
    ctx.fillStyle = cssv(n.color);
    const railW = Math.max(2.5, 3 * view.scale);
    if (n.side === "left") ctx.fillRect(x + w - railW, y, railW, h);
    else ctx.fillRect(x, y, railW, h);
    ctx.restore();
  }

  // Label
  const fs = Math.max(9, 12.5 * view.scale);
  ctx.font = `${isRoot ? 600 : 500} ${fs}px var(--font-node)`;
  ctx.fillStyle = isRoot ? "#ffffff" : cssv("--text");
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const label = fit(n.text, w - 20);
  ctx.fillText(label, x + w / 2, y + h / 2);

  // Note indicator
  if (n.note) {
    ctx.beginPath();
    ctx.arc(x + w - 7, y + 7, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = isRoot ? "rgba(255,255,255,.8)" : cssv("--text-faint");
    ctx.fill();
  }

  // Fold marker
  if (n.children.length && n.folded) {
    ctx.beginPath();
    ctx.arc(x + w + 7, y + h / 2, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = cssv("--accent");
    ctx.fill();
    ctx.strokeStyle = cssv("--panel");
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fit(text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}

/* ── viewport ─────────────────────────────────────────────────────────── */

function fitView(animate = false) {
  const b = bounds();
  const r = stage.getBoundingClientRect();
  const pad = 90;
  const w = b.x1 - b.x0 || 1;
  const h = b.y1 - b.y0 || 1;
  const target = Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h, 1.4);
  const from = { ...view };
  const to = {
    scale: Math.max(0.12, target),
    x: r.width / 2 - ((b.x0 + b.x1) / 2) * Math.max(0.12, target),
    y: r.height / 2 - ((b.y0 + b.y1) / 2) * Math.max(0.12, target),
  };

  if (!animate) {
    Object.assign(view, to);
    updateZoomLabel();
    draw();
    return;
  }

  const t0 = performance.now();
  const dur = 320;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    view.scale = from.scale + (to.scale - from.scale) * e;
    view.x = from.x + (to.x - from.x) * e;
    view.y = from.y + (to.y - from.y) * e;
    updateZoomLabel();
    draw();
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function updateZoomLabel() {
  document.getElementById("zoomlevel").textContent = Math.round(view.scale * 100) + "%";
}

function zoomBy(factor, cx, cy) {
  const r = stage.getBoundingClientRect();
  const px = cx ?? r.width / 2;
  const py = cy ?? r.height / 2;
  const wx = (px - view.x) / view.scale;
  const wy = (py - view.y) / view.scale;
  view.scale = Math.min(4, Math.max(0.1, view.scale * factor));
  view.x = px - wx * view.scale;
  view.y = py - wy * view.scale;
  updateZoomLabel();
  draw();
}

/* ── interaction ──────────────────────────────────────────────────────── */

function hit(cx, cy) {
  const r = stage.getBoundingClientRect();
  const wx = (cx - r.left - view.x) / view.scale;
  const wy = (cy - r.top - view.y) / view.scale;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (wx >= n.x && wx <= n.x + n.w && wy >= n.y && wy <= n.y + n.h) return n;
  }
  return null;
}

let panning = null;

canvas.addEventListener("mousedown", (e) => {
  const n = hit(e.clientX, e.clientY);
  if (n) {
    select(n.id);
    return;
  }
  panning = { x: e.clientX - view.x, y: e.clientY - view.y };
  stage.classList.add("panning");
});

window.addEventListener("mousemove", (e) => {
  if (!panning) return;
  view.x = e.clientX - panning.x;
  view.y = e.clientY - panning.y;
  draw();
});

window.addEventListener("mouseup", () => {
  panning = null;
  stage.classList.remove("panning");
});

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

canvas.addEventListener("dblclick", (e) => {
  const n = hit(e.clientX, e.clientY);
  if (n) {
    select(n.id);
    document.getElementById("text").focus();
  }
});

window.addEventListener("resize", resize);

/* ── inspector wiring ─────────────────────────────────────────────────── */

function select(id) {
  selectedId = id;
  const n = byId(id);
  if (!n) return;

  document.getElementById("nodeid").textContent = "#" + n.id;
  document.getElementById("text").value = n.text;
  document.getElementById("note").value = n.note;
  document.getElementById("m-children").textContent = n.children.length;
  document.getElementById("m-depth").textContent = n.depth;
  document.getElementById("m-size").textContent = Math.round(n.w) + " × " + Math.round(n.h);

  for (const b of document.querySelectorAll("#sides button")) {
    b.setAttribute("aria-pressed", String(b.dataset.side === n.side));
  }
  for (const b of document.querySelectorAll("#layouts button")) {
    b.setAttribute("aria-pressed", String(b.dataset.layout === n.layout));
  }
  for (const s of document.querySelectorAll(".swatch")) {
    s.setAttribute("aria-pressed", String(s.dataset.color === (n.color || "")));
  }
  draw();
}

/* Colour swatches */
const swatchBox = document.getElementById("swatches");
const noneBtn = document.createElement("button");
noneBtn.className = "swatch swatch--none";
noneBtn.dataset.color = "";
noneBtn.textContent = "×";
noneBtn.title = "No colour";
noneBtn.onclick = () => setColor(null);
swatchBox.appendChild(noneBtn);

for (const token of PALETTE) {
  const b = document.createElement("button");
  b.className = "swatch";
  b.dataset.color = token;
  b.style.background = `var(${token})`;
  b.onclick = () => setColor(token);
  swatchBox.appendChild(b);
}

function setColor(token) {
  const n = byId(selectedId);
  if (!n) return;
  n.color = token;
  select(selectedId);
}

/* Text and note edits relayout live, so widths update as you type. */
document.getElementById("text").addEventListener("input", (e) => {
  const n = byId(selectedId);
  if (!n) return;
  n.text = e.target.value || " ";
  rebuild();
  select(selectedId);
});

document.getElementById("note").addEventListener("input", (e) => {
  const n = byId(selectedId);
  if (!n) return;
  n.note = e.target.value;
  select(selectedId);
});

for (const b of document.querySelectorAll("#sides button")) {
  b.onclick = () => {
    const n = byId(selectedId);
    if (!n) return;
    n.side = b.dataset.side;
    rebuild();
    select(selectedId);
  };
}

for (const b of document.querySelectorAll("#layouts button")) {
  b.onclick = () => {
    const n = byId(selectedId);
    if (!n) return;
    n.layout = b.dataset.layout;
    select(selectedId);
  };
}

document.getElementById("zoom-in").onclick = () => zoomBy(1.2);
document.getElementById("zoom-out").onclick = () => zoomBy(1 / 1.2);
document.getElementById("zoom-fit").onclick = () => fitView(true);

/* ── theme ────────────────────────────────────────────────────────────── */

const themeDark = document.getElementById("theme-dark");
const themeLight = document.getElementById("theme-light");

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  themeDark.setAttribute("aria-pressed", String(t === "dark"));
  themeLight.setAttribute("aria-pressed", String(t === "light"));
  draw();
}

themeDark.onclick = () => setTheme("dark");
themeLight.onclick = () => setTheme("light");

/* ── boot ─────────────────────────────────────────────────────────────── */

rebuild();
resize();
fitView();
select(0);
</script>
</body>
</html>
